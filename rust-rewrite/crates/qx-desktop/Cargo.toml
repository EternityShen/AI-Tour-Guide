[package]
name = "qx-desktop"
version = "0.1.0"
edition.workspace = true
description = "Qiaoxiang AI Tour Guide - Rust server + gpui-kit WebView2 shell, zero Python"

[[bin]]
name = "qx-desktop"
path = "src/main.rs"

[features]
# 默认构建保持轻量、无需 C/C++ 工具链，且行为兼容旧版（走 Ollama + qwen3.5:4b）。
# 启用后支持 `--model <GGUF>` 本地内嵌推理（需构建机装有 C/C++ 工具链，会现场编译 llama.cpp）。
default = []
# mtmd = llama.cpp 多模态投影器，内置 Qwen2.5-VL 看图要用。
local-llm = ["dep:llama-cpp-2", "llama-cpp-2/mtmd"]

[dependencies]
qx-core = { path = "../qx-core" }
gpui-kit = "0.9.0"
gpui-webview = "0.9.0"
wry = { version = "0.53.3", package = "lb-wry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "0.6"
llama-cpp-2 = { version = "0.1", optional = true }
# 离线神经语音（Piper VITS）：onnxruntime 动态加载（随 tts/ 资产释放），
# api-24 与随包 onnxruntime.dll 1.24.x 对应。
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
# 运行时在线「小伊」语音：纯 Rust 同步 WebSocket 客户端，自带微软 2026 版
# Sec-MS-GEC v2 签名（旧版签名会被 403 拒绝）。不依赖 Python，保持单 exe 自包含。
msedge-tts = { version = "0.4.1", default-features = false, features = ["blocking"] }
# 离线「小伊」：Windows 11 的 OneCore 自然语音（XiaoyiNeural，Azure 同源离线版），
# 通过 WinRT SpeechSynthesizer 调用。零模型、零显存、零 Python、微软官方合规。
# 前提是系统装了「中文（简体）神经语音」包（设置→时间和语言→语言→中文→语音）。
windows = { version = "0.62", features = [
    "Media_Core",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Foundation",
    "Win32_System_WinRT",
] }

[build-dependencies]
zip = "0.6"
