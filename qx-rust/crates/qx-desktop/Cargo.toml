[package]
name = "qx-desktop"
version = "0.1.0"
edition.workspace = true
description = "Qiaoxiang AI Tour Guide - Rust server + gpui-kit WebView2 shell, zero Python"

[[bin]]
name = "qx-desktop"
path = "src/main.rs"

[features]
# 默认构建行为兼容旧版（走 Ollama + qwen3.5:4b）。
# 语音链路（whisper.cpp / sherpa-onnx）需要 C/C++ 编译工具链；
# 启用 local-llm 后支持 `--model <GGUF>` 本地内嵌推理（会现场编译 llama.cpp）。
default = []
# mtmd = llama.cpp 多模态投影器，内置 Qwen2.5-VL 看图要用。
local-llm = ["dep:llama-cpp-2", "llama-cpp-2/mtmd"]

[dependencies]
qx-core = { path = "../qx-core" }
gpui-kit = "0.9.0"
gpui-webview = "0.9.0"
wry = { version = "0.53.3", package = "lb-wry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 运行日志：tracing 打点 + QX_LOG 环境变量过滤；文件落盘由自研日志库承担
# （后台线程 + tokio 异步写入，按天滚动在外层实现）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "ansi",
  "registry",
  "std",
] }
shen_eternity_log = { git = "https://github.com/EternityShen/shen_eternity_log.git" }
tokio = { version = "1", default-features = false, features = ["rt"] }
zip = "0.6"
# 运行时在线「小伊」语音：纯 Rust 同步 WebSocket 客户端，自带微软 2026 版
# Sec-MS-GEC v2 签名（旧版签名会被 403 拒绝）。不依赖 Python，纯 Rust、跨平台。
msedge-tts = { version = "0.4.1", default-features = false, features = [
  "blocking",
] }
llama-cpp-2 = { version = "0.1", optional = true }
# 离线语音识别（whisper.cpp 的跨平台 Rust 绑定）：cc 直接编译 whisper.cpp，
# Windows（MSVC）/ Linux 通吃，不再依赖任何预编译 DLL 或 LoadLibrary FFI。
# ggml 模型沿用 asr/ggml-base-q5_1.bin，格式不变。
whisper-rs = "0.16"
# 离线神经语音（sherpa-onnx 绑定，跨平台）：直接加载 VITS 模型（Piper 同源），
# 内置 C++ espeak-ng 做 G2P（取代依赖 CPython 的 espeakbridge.pyd —— 那条路
# 在 Rust exe 里本来就加载失败）。
# `static`：cmake 静态编译 sherpa-onnx（含内置 onnxruntime），产物单文件自包含，
# 不需要随包分发 libsherpa-onnx-c-api.so / onnxruntime.dll。
# 注意 default-features = false：官方 `download-binaries` 预编译包不含静态库
# （只有 bin/include），必须关掉并走本机 cmake 编译。
sherpa-rs = { version = "0.6", default-features = false, features = ["tts", "static"] }

[build-dependencies]
zip = "0.6"
